name: Probe 匯率 + 期交所三大法人(一次性,用完即刪)

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 探測央行匯率 + 期交所 OpenAPI
        run: python scripts/probe_fx_taifex.py

      - name: 探測 FinMind 期貨三大法人資料集
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python scripts/probe_finmind_futures.py
