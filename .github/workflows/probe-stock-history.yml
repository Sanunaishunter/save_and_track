name: Probe 個股歷史價格(一次性,用完即刪)

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 探測 TWSE 個股逐月成交資訊(STOCK_DAY)
        run: python scripts/probe_stock_history.py
