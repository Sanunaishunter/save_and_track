name: Probe 大盤指數歷史(MI_INDEX 表格結構,一次性,用完即刪)

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 探測 MI_INDEX 有沒有大盤指數開高低收 / 官方漲跌家數表
        run: python scripts/probe_market_index_history.py
